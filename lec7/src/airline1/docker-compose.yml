version: '3'

services:
    db:
        image: postgres
        environment:
            - POSTGRES_PASSWORD=mysecretpassword
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    web:
        build: .
        volumes:
            - .:/usr/src/app
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
